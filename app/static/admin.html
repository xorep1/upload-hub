<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1420; --card: #1a2130; --border: #2a3347; --text: #e6ebf5;
    --muted: #8792a8; --green: #35c07a; --red: #e5544b;
    --accent: #4f8ccf; --yellow: #e0b34a;
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card h3 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
  .metric { font-size: 30px; font-weight: 700; }
  .metric small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .bar { height: 6px; background: var(--border); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .up { background: rgba(53,192,122,.15); color: var(--green); } .up .dot { background: var(--green); }
  .down { background: rgba(229,84,75,.15); color: var(--red); } .down .dot { background: var(--red); }
  
  section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  
  /* Section Toggle Styles */
  section h2 { font-size: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; cursor: pointer; user-select: none; }
  .toggle-icon { display: inline-block; width: 16px; font-size: 12px; color: var(--muted); transition: transform 0.2s; }
  .section-content { margin-top: 14px; }
  
  .table-wrapper { max-height: 400px; overflow-y: auto; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); z-index: 10; border-bottom: none; box-shadow: 0 1px 0 var(--border); white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; transition: background 0.2s, color 0.2s; }
  th.sortable:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .sort-icon { display: inline-block; margin-left: 4px; font-size: 10px; }
  tr:last-child td { border-bottom: none; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .tag.on { background: rgba(53,192,122,.15); color: var(--green); }
  .tag.off { background: rgba(229,84,75,.15); color: var(--red); }
  .tag.admin { background: rgba(224,179,74,.15); color: var(--yellow); }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.danger { background: var(--red); }
  button:hover { opacity: .8; }
  input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14px; width: 100%; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--accent); }
  
  #login { max-width: 340px; margin: 80px auto; }
  #login h1 { text-align: center; }
  #login .sub { text-align: center; }
  #login form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; }
  .muted { color: var(--muted); }
  .row-actions { display: flex; gap: 6px; }
  .hidden { display: none !important; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="login">
  <h1>🔐 Admin Panel</h1>
  <div class="sub">Sign in with an admin account</div>
  <form onsubmit="doLogin(event)">
    <input id="u" placeholder="Username or phone" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button type="submit">Sign in</button>
  </form>
</div>

<div id="dash" class="hidden">
  <div class="topbar">
    <div>
      <h1>Admin Panel</h1>
      <div class="sub" id="who"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="muted" style="font-size:12px" id="lastUpdate"></span>
      <button class="ghost" onclick="refreshAll(true)">↻ Refresh</button>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid" id="healthCards"></div>
  <div class="grid" id="statCards"></div>
  <div class="grid" id="storageCards"></div>

  
  <section>
    <h2 onclick="toggleSection('files')">
      <span><span id="icon-files" class="toggle-icon">▶</span> Files <span class="muted" id="fileCount"></span></span>
      <span style="display:flex;gap:8px;align-items:center" onclick="event.stopPropagation()">
        <input id="fileSearch" placeholder="Search files…" style="width:220px;padding:7px 10px;font-size:13px" oninput="onFileSearch()">
      </span>
    </h2>
    <div id="content-files" class="section-content hidden">
      <div class="table-wrapper"><table id="filesTable"></table></div>
    </div>
  </section>

  <section>
    <h2 onclick="toggleSection('users')">
      <span><span id="icon-users" class="toggle-icon">▶</span> Users <span class="muted" id="userCount"></span></span>
      <span style="display:flex;gap:8px;align-items:center" onclick="event.stopPropagation()">
        <input id="userSearch" placeholder="Filter users..." style="width:220px;padding:7px 10px;font-size:13px" oninput="renderUsers()">
      </span>
    </h2>
    <div id="content-users" class="section-content hidden">
      <div class="table-wrapper"><table id="usersTable"></table></div>
    </div>
  </section>

  <section>
    <h2 onclick="toggleSection('tokens')">
      <span><span id="icon-tokens" class="toggle-icon">▶</span> Active sessions <span class="muted" id="tokCount"></span></span>
      <span style="display:flex;gap:8px;align-items:center" onclick="event.stopPropagation()">
        <input id="tokenSearch" placeholder="Filter sessions..." style="width:220px;padding:7px 10px;font-size:13px" oninput="renderTokens()">
      </span>
    </h2>
    <div id="content-tokens" class="section-content hidden">
      <div class="table-wrapper"><table id="tokensTable"></table></div>
    </div>
  </section>
</div>

<script>
const API = "";                       
let token = localStorage.getItem("admin_token") || "";

// State Management
let appData = { files: [], users: [], tokens: [] };
let sortState = {
  files:  { key: 'id', asc: false },
  users:  { key: 'id', asc: true },
  tokens: { key: 'login_at', asc: false }
};

// Lazy Loading State
let sectionState = {
  files:  { isOpen: false, hasLoadedOnce: false },
  users:  { isOpen: false, hasLoadedOnce: false },
  tokens: { isOpen: false, hasLoadedOnce: false }
};

function authHeaders() { return { "Authorization": "Bearer " + token }; }

// --- Auth ---
async function doLogin(e) {
  e.preventDefault();
  const err = document.getElementById("loginErr");
  err.textContent = "";
  const body = new URLSearchParams();
  body.set("username", document.getElementById("u").value);
  body.set("password", document.getElementById("p").value);
  try {
    const res = await fetch(API + "/auth/token", { method: "POST", body });
    if (!res.ok) throw new Error("Invalid credentials");
    const data = await res.json();
    token = data.access_token;
    localStorage.setItem("admin_token", token);
    const check = await fetch(API + "/admin/stats", { headers: authHeaders() });
    if (check.status === 403) throw new Error("This account is not an admin");
    if (!check.ok) throw new Error("Login failed");
    showDash();
  } catch (ex) { err.textContent = ex.message; }
}

function showDash() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dash").classList.remove("hidden");
  refreshAll();
}

function logout() {
  localStorage.removeItem("admin_token");
  token = "";
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { ...opts, headers: { ...authHeaders(), ...(opts.headers || {}) } });
  if (res.status === 401 || res.status === 403) { logout(); throw new Error("Session expired"); }
  return res.json();
}

// --- Toggle Sections (Lazy Load) ---
async function toggleSection(sec) {
  const state = sectionState[sec];
  state.isOpen = !state.isOpen;
  
  const content = document.getElementById(`content-${sec}`);
  const icon = document.getElementById(`icon-${sec}`);
  
  if (state.isOpen) {
    content.classList.remove('hidden');
    icon.textContent = '▼';
    // Only fetch from API if we haven't loaded it yet
    if (!state.hasLoadedOnce) {
      if (sec === 'files') await loadFiles();
      if (sec === 'users') await loadUsers();
      if (sec === 'tokens') await loadTokens();
    }
  } else {
    content.classList.add('hidden');
    icon.textContent = '▶';
  }
}

// --- Sorting Utilities ---
function handleSort(type, key) {
  if (sortState[type].key === key) sortState[type].asc = !sortState[type].asc;
  else { sortState[type].key = key; sortState[type].asc = true; }
  if (type === 'files') renderFiles();
  if (type === 'users') renderUsers();
  if (type === 'tokens') renderTokens();
}

function getSortIcon(type, key) {
  if (sortState[type].key !== key) return `<span class="sort-icon muted" style="opacity:0.3">↕</span>`;
  return sortState[type].asc ? `<span class="sort-icon">▲</span>` : `<span class="sort-icon">▼</span>`;
}

function sortArray(arr, key, asc) {
  return arr.sort((a, b) => {
    let v1 = a[key] ?? ""; let v2 = b[key] ?? "";
    let cmp = String(v1).localeCompare(String(v2), undefined, { numeric: true, sensitivity: 'base' });
    return asc ? cmp : -cmp;
  });
}

// --- Dashboard Top Stats ---
function bar(pct) { return `<div class="bar"><span style="width:${pct}%"></span></div>`; }

async function loadHealth() {
  const h = await api("/admin/health");
  document.getElementById("healthCards").innerHTML = h.services.map(s => `
    <div class="card">
      <h3>${s.service}</h3>
      <span class="pill ${s.status === 'up' ? 'up' : 'down'}"><span class="dot"></span>${s.status.toUpperCase()}</span>
      <div class="muted" style="margin-top:8px;font-size:12px">${s.status === 'up' ? s.latency_ms + ' ms' : (s.error || '')}</div>
    </div>`).join("");
}

async function loadStats() {
  const s = await api("/admin/stats");
  document.getElementById("statCards").innerHTML = `
    <div class="card"><h3>CPU</h3><div class="metric">${s.cpu_percent}<small>%</small></div>
      ${bar(s.cpu_percent)}<div class="muted" style="margin-top:8px;font-size:12px">${s.cpu_count} cores</div></div>
    <div class="card"><h3>Memory</h3><div class="metric">${s.memory.percent}<small>%</small></div>
      ${bar(s.memory.percent)}<div class="muted" style="margin-top:8px;font-size:12px">${s.memory.used_mb} / ${s.memory.total_mb} MB</div></div>
    <div class="card"><h3>Disk</h3><div class="metric">${s.disk.percent}<small>%</small></div>
      ${bar(s.disk.percent)}<div class="muted" style="margin-top:8px;font-size:12px">${s.disk.used_gb} / ${s.disk.total_gb} GB</div></div>`;
}

async function loadStorage() {
  const s = await api("/admin/storage");
  const live = s.live || {};
  const liveTag = !s.configured ? `<span class="pill down"><span class="dot"></span>NOT CONFIGURED</span>`
    : (live.status === "up" ? `<span class="pill up"><span class="dot"></span>REACHABLE</span>` : `<span class="pill down"><span class="dot"></span>${(live.status || 'unknown').toUpperCase()}</span>`);
  document.getElementById("storageCards").innerHTML = `
    <div class="card" style="grid-column:1 / -1">
      <h3>Bucket storage${s.bucket ? ' · ' + s.bucket : ''}</h3>
      <div class="metric">${s.used_human} <small>/ ${s.quota_human} · ${s.percent}%</small></div>
      ${bar(Math.min(s.percent, 100))}
      <div class="muted" style="margin-top:8px;font-size:12px">
        ${s.file_count} file(s) · ${s.free_human} free · max upload ${s.max_upload_human} &nbsp; ${liveTag}
      </div>
    </div>`;
}

// --- FILES ---
let fileSearchTimer = null;
function onFileSearch() { clearTimeout(fileSearchTimer); fileSearchTimer = setTimeout(loadFiles, 300); }

async function loadFiles() {
  const q = document.getElementById("fileSearch").value.trim();
  appData.files = await api("/admin/files" + (q ? "?q=" + encodeURIComponent(q) : ""));
  sectionState.files.hasLoadedOnce = true;
  renderFiles();
}

function renderFiles() {
  let arr = [...appData.files];
  document.getElementById("fileCount").textContent = "(" + arr.length + ")";
  arr = sortArray(arr, sortState.files.key, sortState.files.asc);

  let rows = `<tr>
    <th class="sortable" onclick="handleSort('files','id')">ID ${getSortIcon('files','id')}</th>
    <th class="sortable" onclick="handleSort('files','display_name')">Name ${getSortIcon('files','display_name')}</th>
    <th class="sortable" onclick="handleSort('files','original_filename')">File ${getSortIcon('files','original_filename')}</th>
    <th class="sortable" onclick="handleSort('files','owner_username')">Owner ${getSortIcon('files','owner_username')}</th>
    <th class="sortable" onclick="handleSort('files','size_human')">Size ${getSortIcon('files','size_human')}</th>
    <th class="sortable" onclick="handleSort('files','content_type')">Type ${getSortIcon('files','content_type')}</th>
    <th class="sortable" onclick="handleSort('files','created_at')">Uploaded ${getSortIcon('files','created_at')}</th>
    <th>Actions</th>
  </tr>`;
  
  rows += arr.map(f => `<tr>
      <td>${f.id}</td>
      <td>${escapeHtml(f.display_name)}${f.description ? `<div class="muted" style="font-size:11px;margin-top:4px">${escapeHtml(f.description)}</div>` : ''}</td>
      <td class="muted">${escapeHtml(f.original_filename)}</td>
      <td>${escapeHtml(f.owner_username || '?')} <span class="muted">#${f.owner_id}</span></td>
      <td>${f.size_human}</td>
      <td class="muted">${escapeHtml(f.content_type || '—')}</td>
      <td>${fmtTime(f.created_at)}</td>
      <td class="row-actions">
        ${f.download_url ? `<a href="${f.download_url}" target="_blank"><button class="ghost">Download</button></a>` : ''}
        <button class="ghost" onclick="editFile(${f.id}, '${jsEsc(f.display_name)}', '${jsEsc(f.description || '')}')">Edit</button>
        <button class="danger" onclick="deleteFile(${f.id}, '${jsEsc(f.display_name)}')">Delete</button>
      </td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No files</td></tr>`;
  document.getElementById("filesTable").innerHTML = rows;
}

// --- USERS ---
async function loadUsers() {
  appData.users = await api("/admin/users");
  sectionState.users.hasLoadedOnce = true;
  renderUsers();
}

function renderUsers() {
  let arr = [...appData.users];
  const q = document.getElementById("userSearch").value.toLowerCase().trim();
  if (q) arr = arr.filter(u => String(u.username).toLowerCase().includes(q) || String(u.phone).includes(q) || String(u.email).toLowerCase().includes(q) || String(u.id).includes(q));
  
  document.getElementById("userCount").textContent = "(" + arr.length + ")";
  arr = sortArray(arr, sortState.users.key, sortState.users.asc);

  let rows = `<tr>
    <th class="sortable" onclick="handleSort('users','id')">ID ${getSortIcon('users','id')}</th>
    <th class="sortable" onclick="handleSort('users','username')">Username ${getSortIcon('users','username')}</th>
    <th class="sortable" onclick="handleSort('users','phone')">Phone ${getSortIcon('users','phone')}</th>
    <th class="sortable" onclick="handleSort('users','email')">Email ${getSortIcon('users','email')}</th>
    <th class="sortable" onclick="handleSort('users','is_active')">Status ${getSortIcon('users','is_active')}</th>
    <th>Actions</th>
  </tr>`;

  rows += arr.map(u => {
    const banned = !!u.ban;
    const banInfo = banned ? `<div class="muted" style="font-size:11px;margin-top:4px">reason: ${u.ban.reason}${u.ban.until ? ' · until ' + fmtTime(u.ban.until) : ' · permanent'}</div>` : '';
    return `<tr>
      <td>${u.id}</td>
      <td>${u.username} ${u.is_admin ? '<span class="tag admin">admin</span>' : ''}</td>
      <td>${u.phone}</td>
      <td>${u.email || '<span class="muted">—</span>'}</td>
      <td><span class="tag ${u.is_active ? 'on' : 'off'}">${u.is_active ? 'active' : 'disabled'}</span> ${banned ? '<span class="tag off">banned</span>' : ''} ${banInfo}</td>
      <td class="row-actions">
        <button class="ghost" onclick="toggleUser(${u.id})">${u.is_active ? 'Disable' : 'Enable'}</button>
        ${banned ? `<button class="ghost" onclick="unbanUser(${u.id})">Unban</button>` : `<button class="danger" onclick="banUser(${u.id}, '${u.username}')">Ban</button>`}
        <button class="danger" onclick="revokeAll(${u.id})">Revoke sessions</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="muted">No users found</td></tr>`;
  document.getElementById("usersTable").innerHTML = rows;
}

// --- TOKENS (Sessions) ---
async function loadTokens() {
  const t = await api("/admin/tokens");
  appData.tokens = t.sessions || [];
  sectionState.tokens.hasLoadedOnce = true;
  renderTokens();
}

function renderTokens() {
  let arr = [...appData.tokens];
  const q = document.getElementById("tokenSearch").value.toLowerCase().trim();
  if (q) arr = arr.filter(s => String(s.username).toLowerCase().includes(q) || String(s.ip).includes(q) || String(s.device).toLowerCase().includes(q) || String(s.os).toLowerCase().includes(q));
  
  document.getElementById("tokCount").textContent = "(" + arr.length + ")";
  arr = sortArray(arr, sortState.tokens.key, sortState.tokens.asc);

  let rows = `<tr>
    <th class="sortable" onclick="handleSort('tokens','username')">User ${getSortIcon('tokens','username')}</th>
    <th class="sortable" onclick="handleSort('tokens','login_at')">Login time ${getSortIcon('tokens','login_at')}</th>
    <th class="sortable" onclick="handleSort('tokens','ip')">IP ${getSortIcon('tokens','ip')}</th>
    <th class="sortable" onclick="handleSort('tokens','device')">Device ${getSortIcon('tokens','device')}</th>
    <th class="sortable" onclick="handleSort('tokens','os')">OS ${getSortIcon('tokens','os')}</th>
    <th class="sortable" onclick="handleSort('tokens','browser')">Browser ${getSortIcon('tokens','browser')}</th>
    <th class="sortable" onclick="handleSort('tokens','expires_in')">Expires in ${getSortIcon('tokens','expires_in')}</th>
    <th>Action</th>
  </tr>`;

  rows += arr.map(s => `<tr>
      <td>${s.username || '?'} <span class="muted">#${s.user_id}</span></td>
      <td>${fmtTime(s.login_at)}</td>
      <td class="muted">${s.ip || '—'}</td>
      <td>${deviceIcon(s.device)} ${s.device || '—'}</td>
      <td>${s.os || '—'}</td>
      <td>${s.browser || '—'}</td>
      <td>${fmtTtl(s.expires_in)}</td>
      <td><button class="danger" onclick="revokeOne(${s.user_id}, '${s.jti}')">Revoke</button></td>
    </tr>`).join("") || `<tr><td colspan="8" class="muted">No active sessions</td></tr>`;
  document.getElementById("tokensTable").innerHTML = rows;
}

// --- Action API wrappers ---
async function editFile(id, name, desc) {
  const newName = prompt("New display name:", name); if (newName === null) return;
  const newDesc = prompt("Description (leave empty to clear):", desc); if (newDesc === null) return;
  await api(`/admin/files/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ display_name: newName.trim(), description: newDesc.trim() }) });
  loadFiles(); loadStorage();
}
async function deleteFile(id, name) { if (!confirm(`Delete file "${name}"?`)) return; await api(`/admin/files/${id}`, { method: "DELETE" }); loadFiles(); loadStorage(); }
async function toggleUser(id) { await api(`/admin/users/${id}/toggle-active`, { method: "POST" }); loadUsers(); }
async function revokeAll(id) { await api(`/admin/users/${id}/revoke-all`, { method: "POST" }); loadTokens(); }
async function revokeOne(uid, jti) { await api(`/admin/tokens/revoke?user_id=${uid}&jti=${jti}`, { method: "POST" }); loadTokens(); }
async function banUser(id, name) {
  const reason = prompt(`Ban reason for "${name}":`); if (!reason?.trim()) return;
  const minsRaw = prompt("Ban duration in MINUTES (leave empty = permanent):", "60"); if (minsRaw === null) return;
  const minutes = minsRaw.trim() === "" ? 0 : parseInt(minsRaw, 10);
  if (minsRaw.trim() !== "" && (isNaN(minutes) || minutes < 0)) return alert("Invalid number of minutes");
  await api(`/admin/users/${id}/ban`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason: reason.trim(), minutes }) });
  loadUsers();
}
async function unbanUser(id) { await api(`/admin/users/${id}/unban`, { method: "POST" }); loadUsers(); }

// --- Formatters ---
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function jsEsc(s) { return String(s == null ? "" : s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " "); }
function fmtTime(iso) { if (!iso) return "—"; try { return new Date(iso).toLocaleString(); } catch { return iso; } }
function deviceIcon(d) { return { mobile: "📱", tablet: "📱", desktop: "💻", bot: "🤖" }[d] || "🖥️"; }
function fmtTtl(sec) {
  if (sec == null || sec < 0) return "—";
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if (d) return `${d}d ${h}h`; if (h) return `${h}h ${m}m`; return `${m}m`;
}

// --- Core Flow ---
async function refreshAll(manual = false) {
  try {
    // Only load basic health/stats
    const promises = [loadHealth(), loadStats(), loadStorage()];
    
    // Only fetch table data if their section is currently OPEN
    // OR if the user manually clicked "Refresh" we force update the open ones
    if (sectionState.files.isOpen) promises.push(loadFiles());
    if (sectionState.users.isOpen) promises.push(loadUsers());
    if (sectionState.tokens.isOpen) promises.push(loadTokens());
    
    await Promise.all(promises);
    document.getElementById("lastUpdate").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {}
}

// Auto-refresh every 10s (will only refresh stats and open sections)
setInterval(() => { if (token && !document.getElementById("dash").classList.contains("hidden")) { refreshAll(); } }, 10000);
if (token) fetch(API + "/admin/stats", { headers: authHeaders() }).then(r => { if (r.ok) showDash(); else logout(); }).catch(logout);
